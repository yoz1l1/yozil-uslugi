<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Yozil — Услуги</title>
<style>
:root{--bg:#f1f5fb;--card:#fff;--tx:#14213d;--mut:#5b6b86;--ac:#1f5fd6;--ac2:#4aa3ff;--bd:#dbe4f3;--sh:0 6px 20px rgba(31,95,214,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#16223a;--tx:#e8eefb;--mut:#94a5c4;--ac:#5b9cff;--ac2:#7fc0ff;--bd:#25365a;--sh:0 6px 20px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#16223a;--tx:#e8eefb;--mut:#94a5c4;--ac:#5b9cff;--ac2:#7fc0ff;--bd:#25365a;--sh:0 6px 20px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,Arial,sans-serif;transition:background .3s,color .3s}
button{font:inherit;cursor:pointer;color:inherit}
#splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 30%,var(--card),var(--bg))}
#splash h2{font-size:clamp(22px,4vw,36px);margin:0;color:var(--ac)}
.stage{position:relative;display:flex;align-items:flex-end;justify-content:center;height:340px;margin:8px 0}
.rpm{font-size:clamp(90px,18vw,170px);font-weight:900;letter-spacing:6px;line-height:.8;background:linear-gradient(180deg,var(--ac2),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent;position:relative;z-index:2;padding-bottom:6px;filter:drop-shadow(0 8px 10px rgba(31,95,214,.25))}
#skin{position:relative;z-index:1;margin-left:-70px;width:128px;height:256px;image-rendering:pixelated;transform:rotate(-9deg);transform-origin:50% 100%;animation:lean 4s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25))}
@keyframes lean{50%{transform:rotate(-6deg) translateY(-3px)}}
.sub{font-size:clamp(16px,2.4vw,22px);color:var(--mut);margin:0 0 14px}
.go{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:14px;padding:16px 36px;font-size:18px;font-weight:700;box-shadow:var(--sh);transition:transform .2s}
.go:hover{transform:translateY(-3px) scale(1.03)}
#app{display:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);box-shadow:var(--sh);display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--ac)}
.logo svg{width:38px;height:38px;animation:pulse 3s infinite}.logo span b{color:var(--tx);font-weight:600}
@keyframes pulse{50%{transform:scale(1.08) rotate(-4deg)}}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:11px 16px 11px 40px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;outline:none}
.search input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(31,95,214,.18)}
.search svg{position:absolute;left:12px;top:11px;width:20px;height:20px;stroke:var(--mut)}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);display:grid;place-items:center}
.ib svg{width:22px;height:22px;transition:transform .5s}.ib:hover svg{transform:rotate(30deg) scale(1.1)}
.tags{display:flex;gap:8px;flex-wrap:wrap;padding:14px 24px 0}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:7px 16px;font-size:14px;transition:.2s}
.chip:hover{border-color:var(--ac)}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#note{padding:8px 24px 0;color:var(--mut);font-size:13px;min-height:22px}
main{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:16px 24px 40px;max-width:1400px;margin:0 auto}
@media(max-width:1000px){main{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;text-align:left;box-shadow:var(--sh);transition:transform .2s,border-color .2s;display:flex;flex-direction:column;gap:10px;animation:in .4s both}
.card:hover{transform:translateY(-5px);border-color:var(--ac)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.ic{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,rgba(31,95,214,.14),rgba(74,163,255,.22));display:grid;place-items:center;color:var(--ac)}
.ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card h3{margin:0;font-size:17px}.card p{margin:0;color:var(--mut);font-size:14px;line-height:1.4}
.card:hover .a0 svg{animation:bounce .6s}.card:hover .a1 svg{animation:spin .8s}.card:hover .a2 svg{animation:wig .5s}.card:hover .a3 svg{animation:pop .5s}.card:hover .a4 svg{animation:swing .7s}
@keyframes bounce{40%{transform:translateY(-7px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes wig{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}@keyframes pop{50%{transform:scale(1.3)}}@keyframes swing{30%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
#empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px}
#modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
#modal.open{display:flex}.box{background:var(--card);border-radius:20px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:28px;position:relative;animation:in .25s}
.box h2{margin-top:0;color:var(--ac)}.box p{line-height:1.6}.warn{border-left:4px solid var(--ac);background:var(--bg);padding:10px 14px;border-radius:8px;margin:10px 0;line-height:1.6}code{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 6px;font-family:Consolas,monospace;font-size:.9em}.ul{padding-left:20px;line-height:1.9}.box.empty{min-height:240px}.x{position:absolute;right:14px;top:14px}.cmd{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-family:Consolas,monospace;font-size:13px;word-break:break-all;margin:10px 0 0}.pl{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;margin:8px 0}.pl b{font-size:22px;color:var(--ac);margin-right:4px}
.promo{height:42px;border-radius:12px;border:1px solid var(--ac);background:var(--card);color:var(--ac);padding:0 14px;font-weight:600;display:flex;align-items:center;gap:6px;transition:.2s}
.promo svg{width:20px;height:20px}.promo:hover{background:var(--ac);color:#fff}.promo:hover svg{animation:wig .5s}
.pin{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;margin:8px 0 14px;outline:none;text-transform:uppercase}
.pin:focus{border-color:var(--ac)}#pmsg{min-height:24px;font-weight:600}
#pigs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#pigs span{position:absolute;bottom:-60px;animation:fl linear infinite}
@keyframes fl{to{transform:translateY(-115vh) rotate(360deg)}}
main,.tags,#note{position:relative;z-index:1}
.bp{position:fixed;font-size:30px;pointer-events:none;z-index:50;animation:burst .9s ease-out forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.3);opacity:1}70%{opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) scale(1.5);opacity:0}}
html:root[data-pig="1"]{--bg:#ffe0ee;--card:#fff6fa;--tx:#5a1f3d;--mut:#a55a80;--ac:#e84a8f;--ac2:#ff9ac4;--bd:#ffb8d6;--sh:0 6px 20px rgba(232,74,143,.28)}
html[data-pig="1"] body{background:linear-gradient(180deg,#ffd1e6,#ffe9f3)}
html[data-pig="1"] .logo::after{content:"🐷";font-size:26px;animation:wig 1.2s infinite}
html[data-pig="1"] .ic{position:relative}
html[data-pig="1"] .ic::after{content:"🐽";position:absolute;right:-10px;bottom:-10px;font-size:18px;animation:pop 1.6s infinite}
html[data-pig="1"] .card{border-radius:26px;border-width:2px}
html[data-pig="1"] .go{animation:pop 1.4s infinite}
</style></head><body>
<section id="splash"><h2>Приветствую</h2>
<div class="stage"><div class="rpm">RPM</div><canvas id="skin" width="160" height="320"></canvas></div>
<p class="sub">Методический материал по командам</p>
<button class="go" id="go">Приступить к познаниям</button></section>
<div id="pigs"></div><div id="app"><header>
<div class="logo"><svg viewBox="0 0 40 40"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--ac2)"/><stop offset="1" style="stop-color:var(--ac)"/></linearGradient></defs><path d="M20 3l15 6v10c0 9-6 15-15 18C11 34 5 28 5 19V9z" fill="url(#g)"/><path d="M13 14l7 8 7-8M20 22v8" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Yozil <b>- Услуги</b></span></div>
<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="q" placeholder="Поиск гайда, например: Модельки" autocomplete="off"></div>
<button class="promo" id="pb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a2 2 0 0 0 0 6v3h18v-3a2 2 0 0 1 0-6V6H3zM14 6v12" stroke-dasharray="2 2.5"/></svg>Промокод</button><button class="promo" id="pigoff" style="display:none">🐷 Выключить свинячую тему</button><button class="ib" id="snd" title="Звуки">🔊</button>
<button class="ib" id="th" title="Сменить тему"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></header>
<div class="tags" id="tags"></div><div id="note"></div><main id="grid"></main></div>
<div id="modal"><div class="box"><button class="ib x" id="cl">✕</button><h2 id="mt"></h2><div id="mb"></div></div></div>

function beep(f=520,d=.09){if(!sound)return;if(document.documentElement.hasAttribute("data-pig")){oink();return}try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function oink(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;[0,.19].forEach(o=>{const os=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain(),lf=AC.createOscillator(),lg=AC.createGain(),b=200+Math.random()*70;os.type="sawtooth";os.frequency.setValueAtTime(b*1.4,t+o);os.frequency.exponentialRampToValueAtTime(b*.6,t+o+.15);lf.frequency.value=38;lg.gain.value=35;lf.connect(lg);lg.connect(os.frequency);f.type="bandpass";f.frequency.value=700;f.Q.value=1.5;g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.35,t+o+.02);g.gain.exponentialRampToValueAtTime(.001,t+o+.17);os.connect(f);f.connect(g);g.connect(AC.destination);os.start(t+o);lf.start(t+o);os.stop(t+o+.2);lf.stop(t+o+.2)})}catch(e){}}

function buildPigs(){const b=$("#pigs");b.innerHTML="";for(let i=0;i<18;i++){const e=document.createElement("span");e.textContent=i%4?"🐷":"🐽";e.style.left=Math.random()*96+"%";e.style.fontSize=24+Math.random()*34+"px";e.style.animationDuration=9+Math.random()*10+"s";e.style.animationDelay=-Math.random()*16+"s";b.append(e)}}
function pigOn(){root.setAttribute("data-pig","1");$("#pigoff").style.display="flex";buildPigs();try{localStorage.setItem("yz-p","1")}catch(e){}}
function pigOff(){root.removeAttribute("data-pig");$("#pigoff").style.display="none";$("#pigs").innerHTML="";try{localStorage.removeItem("yz-p")}catch(e){}}
document.addEventListener("click",e=>{if(!root.hasAttribute("data-pig"))return;const n=e.target.closest(".card")?7:3;for(let i=0;i<n;i++){const s=document.createElement("span");s.className="bp";s.textContent=i%3?"🐷":"🐽";s.style.left=e.clientX+"px";s.style.top=e.clientY+"px";s.style.setProperty("--dx",(Math.random()-.5)*220+"px");s.style.setProperty("--dy",-40-Math.random()*160+"px");s.style.setProperty("--r",(Math.random()-.5)*540+"deg");document.body.append(s);setTimeout(()=>s.remove(),950)}});

const HTML={8:`<p><b>Создание магазина:</b></p><div class="cmd">/shopkeeper give ваш ник</div><p>- выдать себе яйцо призыва жителя с магазином</p><p>Не целитесь ни в какой блок.</p><p><b>Затем:</b></p><ul class="ul"><li>Щелкните левой/правой кнопкой мыши, чтобы выбрать тип магазина.</li><li>Щелкните правой кнопкой мыши, чтобы выбрать тип объекта.</li><li>Щелкните правой кнопкой мыши на контейнере, чтобы выбрать его.</li><li>Затем щелкните правой кнопкой мыши на блоке, чтобы поместить владельца магазина.</li></ul><div class="warn"><b>Сундук - это хранилище магазина</b><br><b>Редактировать магазин :</b> SHIFT+ПКМ по жителю</div>`,0:`<p><b>Свод некоторых полезных команд/связок команд на RPM :</b></p><p><b>ПОМЕНЯТЬ ПОЛ</b></p><div class="cmd">/lp user ник permission settemp rpmpassport.gender true 1m</div><div class="cmd">/sudo ник pass gender male</div><div class="cmd">/rpkill deliver</div><p>- достать из морга</p><div class="cmd">/jail deliver</div><p>- достать из тюрьмы</p><p><b>Выдать себе невидимую рамку</b></p><div class="cmd">/execute at ваш ник run give ваш ник item_frame{EntityTag:{Invisible:1b}} 1</div><div class="cmd">/rpmantirdm set ник</div><p>- выдать ганбан</p><div class="cmd">/rpmantirdm remove ник</div><p>- снять ганбан/проверить его наличие у игрока</p><div class="cmd">/playerskull ник</div><p>- получить голову игрока</p><div class="cmd">/casino fix 2</div><p>- удаляет фантомные модельки</p><div class="cmd">/execute run kill @e[distance=..2,type=!minecraft:player]</div><p>- удаляет фантомные модельки(только не прописывайте рядом с игроками)</p><div class="cmd">/bubblerm 2</div><p>- удалить летающую надпись в радиусе 2 блоков (фантомные текста в воздухе, забаганные)</p><p><b>Синхронизовать лифт</b></p><div class="cmd">/rg select назвРГ</div><div class="cmd">/elevatoradmin region create назвРГ</div>`,3:`<p><b>Создать NPC:</b></p><div class="cmd">/npc create &lt;id&gt; &lt;type&gt;</div><p><b>Например:</b></p><div class="cmd">/npc create professor player<br>/npc create guard zombie</div><p><code>id</code> — уникальное имя NPC, по которому ты потом управляешь им.</p><p><code>type</code> — тип сущности: <code>player</code>, <code>zombie</code>, <code>villager</code>, <code>armor_stand</code> и т. д.</p><p><b>Удалить:</b></p><div class="cmd">/npc delete &lt;id&gt;</div><p><b>Посмотреть всех NPC:</b></p><div class="cmd">/npc list</div><p><b>Переместить NPC к себе:</b></p><div class="cmd">/npc move &lt;id&gt;</div><p><b>Телепортироваться к NPC:</b></p><div class="cmd">/npc teleport &lt;id&gt;</div><p><b>Установить координаты:</b></p><div class="cmd">/npc setlocation &lt;id&gt; &lt;x&gt; &lt;y&gt; &lt;z&gt;</div><p><b>Повернуть NPC:</b></p><div class="cmd">/npc setrotation &lt;id&gt; &lt;yaw&gt; &lt;pitch&gt;</div><p><b>Изменить тип:</b></p><div class="cmd">/npc type &lt;id&gt; &lt;type&gt;</div><p><b>Изменить ID:</b></p><div class="cmd">/npc changeid &lt;старый&gt; &lt;новый&gt;</div><p><b>Сделать NPC невидимым/видимым:</b></p><div class="cmd">/npc toggle &lt;id&gt;</div><p><b>Скин:</b></p><div class="cmd">/npc skin &lt;id&gt; static &lt;ник&gt;</div><p><b>Например:</b></p><div class="cmd">/npc skin professor static Notch</div><p>Есть <code>static</code>, <code>dynamic</code>, <code>mirror</code> и <code>url</code> для разных способов установки скина.</p><p><b>Голограмма над NPC:</b></p><div class="cmd">/npc holo add &lt;id&gt; &lt;текст&gt;</div><p><b>Например:</b></p><div class="cmd">/npc holo add professor &amp;6Профессор<br>/npc holo add professor &amp;7Нажмите ПКМ</div><p><b>Удалить строку:</b></p><div class="cmd">/npc holo delete &lt;id&gt; &lt;номер&gt;</div><p><b>Изменить строку:</b></p><div class="cmd">/npc holo set &lt;id&gt; &lt;номер&gt; &lt;текст&gt;</div><p><b>Изменить высоту:</b></p><div class="cmd">/npc holo offset &lt;id&gt; &lt;высота&gt;</div><div class="warn"><b>Property — это свойства NPC.</b></div><p><b>Основной синтаксис:</b></p><div class="cmd">/npc property set &lt;id&gt; &lt;property&gt; &lt;value&gt;</div><p><b>Например:</b></p><div class="cmd">/npc property set professor look CLOSEST_PLAYER</div><p>NPC будет смотреть на ближайшего игрока.</p><div class="cmd">/npc property set professor look_distance 20</div><p>Дистанция взгляда — 20 блоков.</p><div class="cmd">/npc property set professor glow RED</div><p>Красное свечение.</p><div class="cmd">/npc property set professor invisible true</div><p>Сделать невидимым.</p><div class="cmd">/npc property set professor silent true</div><p>Убрать звуки.</p><div class="cmd">/npc property set professor fire true</div><p>Поджечь.</p><div class="cmd">/npc property set zombie baby true</div><p>Сделать зомби маленьким.</p><div class="cmd">/npc property set professor view_distance 50</div><p>NPC будет виден на расстоянии до 50 блоков.</p><p><b>Удаление свойства:</b></p><div class="cmd">/npc property remove &lt;id&gt; &lt;property&gt;</div><p><b>Например:</b></p><div class="cmd">/npc property remove professor glow</div><p>Экипировка также задаётся через properties. Например, берёшь предмет в руку и:</p><div class="cmd">/npc property set professor helmet</div><p><b>Аналогично:</b></p><div class="cmd">/npc property set professor chestplate<br>/npc property set professor leggings<br>/npc property set professor boots<br>/npc property set professor hand<br>/npc property set professor offhand</div><div class="warn"><b>Action — действие, которое выполняется при взаимодействии с NPC.</b></div><p><b>Основной синтаксис:</b></p><div class="cmd">/npc action add &lt;action&gt; &lt;id&gt; &lt;click&gt; &lt;cooldown&gt; &lt;delay&gt; &lt;value&gt;</div><p><b>Виды action:</b></p><div class="cmd">consolecommand</div><div class="cmd">message</div><div class="cmd">playerchat</div><div class="cmd">playercommand</div><div class="cmd">switchserver</div><p><b>Типы клика:</b></p><div class="cmd">ANY_CLICK</div><div class="cmd">LEFT_CLICK</div><div class="cmd">RIGHT_CLICK</div><p><code>cooldown</code> — задержка между срабатываниями в секундах.</p><p><code>delay</code> — задержка перед выполнением в тиках.</p><p><code>value</code> — что именно выполнить/отправить.</p><p><b>Например, сообщение игроку:</b></p><div class="cmd">/npc action add message professor RIGHT_CLICK 3 0 Добро пожаловать в университет!</div><p>ПКМ по NPC → игрок получит сообщение.</p><p><b>Команда от имени игрока:</b></p><div class="cmd">/npc action add playercommand professor RIGHT_CLICK 3 0 menu</div><p>ПКМ → игрок выполнит:</p><div class="cmd">/menu</div><p><b>Команда от имени консоли:</b></p><div class="cmd">/npc action add consolecommand professor RIGHT_CLICK 3 0 give %player_name% diamond 1</div><p>ПКМ → консоль выдаст игроку алмаз.</p><p><code>%player_name%</code> можно использовать там, где установленная система плейсхолдеров это поддерживает.</p><p><b>Посмотреть actions:</b></p><div class="cmd">/npc action list &lt;id&gt;</div><p><b>Удалить action:</b></p><div class="cmd">/npc action delete &lt;id&gt; &lt;номер&gt;</div><p><b>Изменить action:</b></p><div class="cmd">/npc action edit &lt;id&gt; &lt;номер&gt; &lt;action&gt; &lt;click&gt; &lt;cooldown&gt; &lt;delay&gt; &lt;value&gt;</div><p><b>Удалить все actions:</b></p><div class="cmd">/npc action clear &lt;id&gt;</div><p><b>Самая полезная схема для запоминания:</b></p><div class="cmd">/npc create ID TYPE</div><p>→ создать NPC</p><div class="cmd">/npc property set ID PROPERTY VALUE</div><p>→ изменить свойство</p><div class="cmd">/npc action add ACTION ID CLICK COOLDOWN DELAY VALUE</div><p>→ добавить действие</p><div class="cmd">/npc holo add ID TEXT</div><p>→ добавить текст над NPC</p><div class="cmd">/npc skin ID TYPE SKIN</div><p>→ установить скин</p><div class="cmd">/npc move ID</div><p>→ переместить к себе</p><div class="cmd">/npc delete ID</div><p>→ удалить</p><p><b>Пример полноценного NPC университета:</b></p><div class="cmd">/npc create dean player<br>/npc skin dean static Notch<br>/npc property set dean look CLOSEST_PLAYER<br>/npc property set dean look_distance 15<br>/npc holo add dean &amp;6&amp;lДЕКАН<br>/npc holo add dean &amp;7Нажмите ПКМ для меню<br>/npc action add message dean RIGHT_CLICK 2 0 &amp;eДобро пожаловать в университет!<br>/npc action add playercommand dean RIGHT_CLICK 2 0 university</div><p>В итоге получится NPC-декан: имеет скин, смотрит на игроков, над ним висит голограмма, а при ПКМ отправляет сообщение и выполняет <code>/university</code>.</p>`,2:`<p><code>/summon</code> — команда для создания сущностей (мобов, предметов, стрел, молний и т. д.).</p><p><b>Основной синтаксис:</b></p><div class="cmd">/summon &lt;сущность&gt; [координаты] [NBT]</div><ul class="ul"><li><code><сущность></code> — что создать: <code>minecraft:zombie</code>, <code>minecraft:item</code>, <code>minecraft:lightning_bolt</code> и т. д.</li><li><code>~ ~ ~</code> — создать относительно текущей позиции.</li><li><code>X Y Z</code> — создать на конкретных координатах.</li><li><code>~ ~1 ~</code> — создать на 1 блок выше.</li><li><code>~ ~ ~5</code> — создать на 5 блоков вперёд по оси Z.</li><li>Можно использовать <code>^ ^ ^</code> вместе с <code>/execute</code> для создания относительно направления взгляда.</li><li><code>NBT</code> — настройки создаваемой сущности.</li></ul><p><b>NBT:</b></p><ul class="ul"><li><code>CustomName</code> — имя сущности.</li><li><code>NoAI:1b</code> — отключить ИИ моба.</li><li><code>Invulnerable:1b</code> — сделать неуязвимым.</li><li><code>Silent:1b</code> — отключить звуки.</li><li><code>Glowing:1b</code> — добавить свечение.</li><li><code>NoGravity:1b</code> — отключить гравитацию.</li><li><code>PersistenceRequired:1b</code> — моб не будет исчезать из-за обычного деспавна.</li><li><code>Tags:["название"]</code> — добавить тег, по которому потом можно найти сущность через селектор.</li><li><code>Health</code> — установить здоровье.</li><li><code>Attributes</code> — изменить характеристики, например скорость или урон.</li></ul><p>Для предметов используются свои NBT-компоненты/данные, поэтому их синтаксис отличается от мобов.</p><h3>Примеры:</h3><div class="cmd">/summon minecraft:zombie ~ ~ ~</div><p>Создать зомби рядом с командой.</p><div class="cmd">/summon minecraft:zombie ~ ~1 ~ {NoAI:1b,Invulnerable:1b,Silent:1b}</div><p>Создать неподвижного, неуязвимого и беззвучного зомби.</p><div class="cmd">/summon minecraft:armor_stand ~ ~ ~ {Invisible:1b,Invulnerable:1b}</div><p>Создать невидимую стойку для брони.</p><div class="cmd">/summon minecraft:lightning_bolt ~ ~ ~</div><p>Создать молнию.</p><p>Особенно полезно сочетать /summon с /execute:</p><div class="cmd">/execute at @a run summon minecraft:zombie ~ ~ ~</div><div class="warn"><b>Главное запомнить:</b><br>/summon = создать сущность<br>сущность → что создать<br>координаты → где создать<br>NBT → какими свойствами она будет обладать</div><div class="warn"><b>УБРАТЬ ТОБ ЧТО ВЫ ЗАСПАВНИЛИ МОЖНО КОМАНДОЙ /CASINO FIX 2</b></div><h3>Вот примеры от меня:</h3><p><b>Росток зелёный:</b></p><div class="cmd">/summon minecraft:block_display ~ ~ ~ {Passengers:[{id:"minecraft:block_display",block_state:{Name:"minecraft:melon_stem",Properties:{age:"7"}},transformation:[0.5f,0f,0f,0f,0f,1f,0f,0f,0f,0f,0.5f,0f,0f,0f,0f,1f]}]}</div><p><b>Крутой сорняк:</b></p><div class="cmd">/summon minecraft:item_display ~ ~ ~ {item:{id:"minecraft:feather",Count:1b,tag:{CustomModelData:45}},transformation:{translation:[0f,0f,0f],left_rotation:[0f,0.5f,0f,1f],scale:[0.1f,1.5f,0.1f],right_rotation:[0f,0f,0f,1f]}}</div><p><b>Сухой росток:</b></p><div class="cmd">/summon minecraft:block_display ~ ~ ~ {Passengers:[{id:"minecraft:block_display",block_state:{Name:"minecraft:dead_bush"},transformation:[0.3f,0f,0f,0f,0f,0.6f,0f,0f,0f,0f,0.3f,0f,0f,0f,0f,1f]}]}</div><p><b>Железная панель:</b></p><div class="cmd">/summon minecraft:block_display ~ ~ ~ {Passengers:[{id:"minecraft:block_display",block_state:{Name:"minecraft:iron_block"},transformation:[1.4f,0f,0f,0f,0f,1f,0f,0f,0f,0f,0.05f,0f,-0.2f,0f,0.475f,1f]}]}</div><p><b>Медная панель:</b></p><div class="cmd">/summon minecraft:block_display ~ ~ ~ {Passengers:[{id:"minecraft:block_display",block_state:{Name:"minecraft:copper_block"},transformation:[0f,0f,-1.4f,0f,0f,1f,0f,0f,0.05f,0f,0f,0f,0.475f,0f,1.2f,1f]}]}</div><p><b>Фаербол</b></p><div class="cmd">/summon minecraft:fireball ~ ~1 ~ {Motion:[0.0,0.0,0.0],ExplosionPower:2}</div><p><b>Молния:</b></p><div class="cmd">/summon minecraft:lightning_bolt ~ ~ ~</div><p><b>Граната</b></p><div class="cmd">/summon minecraft:tnt ~ ~ ~ {block_state:{Name:"minecraft:conduit"},Motion:[0.0,0.3,0.5],fuse:60}</div>`,1:`<p><code>/execute</code> — команда, которая позволяет изменить условия, исполнителя, позицию и другие параметры перед выполнением другой команды.</p><ul class="ul"><li><code>run</code> — выполнить команду: <code>/execute run say Привет</code></li><li><code>as</code> — изменить исполнителя: <code>/execute as @a run say Привет</code></li><li><code>at</code> — выполнить на позиции цели: <code>/execute at @p run summon zombie</code></li><li><code>as @a at @s</code> — для каждого игрока выполнять команду на его позиции</li><li><code>positioned X Y Z</code> — изменить координаты выполнения</li><li><code>positioned as @p</code> — взять позицию сущности</li><li><code>in</code> — изменить измерение: <code>in minecraft:the_nether</code></li><li><code>if</code> — выполнить, если условие истинно</li><li><code>unless</code> — выполнить, если условие ложно</li><li><code>if entity</code> — проверить наличие сущности: <code>if entity @e[type=zombie]</code></li><li><code>if block</code> — проверить блок: <code>if block ~ ~-1 ~ minecraft:stone</code></li><li><code>if blocks</code> — сравнить две области</li><li><code>if score</code> — проверить значение scoreboard: <code>if score @s money matches 10..</code></li><li><code>matches</code> — диапазон чисел: <code>5</code>, <code>5..10</code>, <code>5..</code>, <code>..10</code></li><li><code>store result</code> — сохранить числовой результат команды</li><li><code>store success</code> — сохранить успешность выполнения команды</li><li><code>rotated</code> — изменить направление взгляда</li><li><code>facing</code> — направить выполнение в сторону точки/сущности</li><li><code>anchored eyes/feet</code> — выбрать точку отсчёта: глаза или ноги</li><li><code>align</code> — выровнять координаты по сетке</li><li><code>on</code> — переключиться на связанную с исполнителем сущность</li><li><code>^ ^ ^</code> — локальные координаты относительно направления взгляда</li><li><code>~ ~ ~</code> — относительные координаты относительно текущей позиции</li><li><code>@s</code> — текущий исполнитель</li><li><code>@p</code> — ближайший игрок</li><li><code>@a</code> — все игроки</li><li><code>@e</code> — все сущности</li><li><code>@r</code> — случайный игрок</li></ul><p><b>Главная схема:</b></p><div class="cmd">/execute as КТО at ГДЕ if УСЛОВИЕ run КОМАНДА</div><p>Например:</p><div class="cmd">/execute as @a at @s if block ~ ~-1 ~ minecraft:diamond_block run give @s minecraft:diamond 1</div><p>Читается так: «Для каждого игрока, на его позиции, если под ним алмазный блок — дать ему алмаз».</p><div class="warn"><b>Главное запомнить:</b><br><code>as</code> = кто → <code>at</code> = где → <code>if/unless</code> = условие → <code>run</code> = действие.</div>`,7:`<h3>КАК СДЕЛАТЬ УВЕЛИЧЕННУЮ МЕБЕЛЬ/АКСЕССУАРЫ :</h3><p><b>1.</b> Выкинуть предмет, затем рядом с ним прописать команду :</p><div class="cmd">/execute as @e[type=minecraft:item,distance=..5,sort=nearest,limit=1] run tellraw ВАШ НИК [{"text":"CMD: ","color":"yellow"},{"nbt":"Item.tag.CustomModelData","entity":"@s"}]</div><p>Сохранить номер CMD.</p><p><b>2.</b> Отойти и прописать команду :</p><div class="cmd">/summon minecraft:item_display ~ ~1 ~ {item:{id:"minecraft:feather",Count:1b,tag:{CustomModelData:308}},transformation:{translation:[0f,0f,0f],left_rotation:[0f,0f,0f,1f],scale:[3f,3f,3f],right_rotation:[0f,0f,0f,1f]}}</div><p>Нужно вставить нужные CMD который выдало, а также обратить внимание на id предмета, в данном случае это перо.</p><p>Параметр "scale" меняет размер предмета, поворачивать можно через left и right_rotation.</p>`,6:`<p>Команда particle. Давайте разберём её по частям на примере :</p><div class="cmd">/particle minecraft:large_smoke ~ ~1 ~ 1 1 1 0.05 100 force</div><p><b>minecraft:large_smoke</b> - это сам эффект, который вы хотите воспроизвести.</p><p><b>~ ~1 ~</b> это позиция на которой будет воспроизведён эффект (~1 - единица означает, что будет по оси y на 1 блок выше вашей текущей позиции. Например если вы напишите "~3 ~-2 ~" - то это будет означать, что эффект будет от вашей текущей на 3 блока вперёд по оси x и на 2 блока вниз по оси y)</p><p><b>1 1 1</b> это показывает области по осям x y z в которой эффект будет распространён, можно менять эти параметры</p><p><b>0.05</b> это у нас показывает скорость частиц</p><p><b>100</b> - количество частиц</p><p><b>force</b> - малозначительный параметр, просто указывайте force всегда и всё</p>`,5:`<p>Представим рандомную команду playsound и разберем её по частям :</p><div class="cmd">/playsound minecraft:entity.enderman.ambient block @a[distance=..5] ~ ~ ~ 5 0.1</div><p><b>minecraft:entity.enderman.ambient</b> - это параметр, задающий определенный звук, который мы хотим проигрывать игрокам. Он делится на категории, стоящие сразу после "minecraft" : block(блоки), ambient(окружение), entity(существа), ui(звуки менюшек майнкрафта), cars(RPM машины).</p><p><b>block</b> - это тот параметр в найстроках, от которого будет зависеть громкость звука</p><p><b>@a</b> - атрибут, затрагивающий все сущности([distance=..5] - это функция, которая показывает, что этот звук будут слышать все существа, находящиеся от вас или заданной координаты на 5 блоков)</p><div class="warn"><b>ВАЖНО :</b><br>[distance=..5] - от координаты до 5 блоков включительно;<br>[distance=5..] - от 5 блоков от координаты до бесконечности;<br>[distance=.5.] - ровно на 5 блоке от заданной координаты.</div><p><b>~ ~ ~</b> это обозначение вашей позиции в майнкрафте, вместо них можно указать координаты в мире, от которых будет производится звук</p><p><b>5</b> - это громкость вашего звука</p><p><b>0.1</b> - это скорость воспроизведения вашего звука ( ОТ 0.1 ДО 2)</p><div class="warn"><b>ДАЛЕЕ НИКАКИЕ ЦИФРЫ ПОСЛЕ ЭТОГО НЕ СТАВИМ, СЛЕДУЮЩИЙ ПАРАМЕТР MINVOLUM БУДЕТ ПРОИЗВОДИТЬ ЗВУК НА ВЕСЬ СЕРВЕР</b></div><p>Вот список интересных и полезных звуков, которые я подобрал :</p><h3>ЗВУКИ</h3><p><b>Пугающие звуки:</b></p><div class="cmd">/playsound minecraft:entity.enderman.ambient block @a[distance=..5] ~ ~ ~ 5 0.1</div><div class="cmd">/playsound minecraft:entity.enderman.stare block @a[distance=..5] ~ ~ ~ 5 0.1</div><div class="cmd">/playsound minecraft:entity.enderman.scream block @a[distance=..5] ~ ~ ~ 5 0.1</div><div class="cmd">/playsound minecraft:entity.allay.item_given block @a[distance=..5] ~ ~ ~ 5 0.1</div><div class="cmd">/playsound minecraft:ambient.cave block @a[distance=..5] ~ ~ ~ 5 0.1</div><p><b>Гром:</b></p><div class="cmd">/playsound minecraft:entity.lightning_bolt.thunder block @a[distance=..5] ~ ~ ~ 5 0.1</div><p><b>Звук ходьбы :</b></p><div class="cmd">/playsound minecraft:entity.warden.heartbeat block @a[distance=..5] ~ ~ ~ 15 1</div><p><b>Сердцебиение:</b></p><div class="cmd">/playsound minecraft:entity.warden.heartbeat block @a[distance=..5] ~ ~ ~ 15 0.1</div><p><b>Страшный звон:</b></p><div class="cmd">/playsound minecraft:block.bell.resonate block @a[distance=..5] ~ ~ ~ 15 0.1</div><p><b>Реактор:</b></p><div class="cmd">/playsound minecraft:block.beacon.activate block @a[distance=..5] ~ ~ ~ 5 1</div><p><b>Звук выполненного задания:</b></p><div class="cmd">/playsound minecraft:ui.toast.challenge_complete block @a[distance=..5] ~ ~ ~ 30 0.1</div><p><b>Страшный резкий и атмосферный звук:</b></p><div class="cmd">/playsound minecraft:block.end_portal.spawn block @a[distance=..5] ~ ~ ~1 15 0.1</div><p><b>Admin pidoras:</b></p><div class="cmd">/playsound cars:xapam block @a[distance=..5] ~ ~ ~ 15 0.1</div><p><b>Взрыв:</b></p><div class="cmd">/playsound minecraft:entity.generic.explode block @a[distance=..5] ~ ~ ~ 5 1</div>`,4:`<p>Для выдачей префикса у нас есть простая команда :</p><div class="cmd">/lp user ник игрока meta addtempprefix 6 "᧦" 1m</div><p>- добавляет префикс игроку, который накладывается поверх его основного(Можно прописать еще раз эту же команду и тогда уже у игрока будет не 1 минуту держаться данный префикс, а две, потому что они суммируются)</p><div class="cmd">/lp user ник игрока meta settempprefix 6 "᧦" 1m</div><p>- устанавливает префикс на определенное количество времени</p><p><b>᧦</b> - это символ, который определяет префикс, который вы поставите игроку. Их полным полно, но вот большинство интересных префиксов:</p><div class="pl"><div><b>᧡</b> - киллер</div><div><b>᧢</b> - убийца</div><div><b>᧣</b> - ассасин</div><div><b>᧤</b> - батя</div><div><b>᧥</b> - самурай</div><div><b>᧦</b> - ублюдок</div><div><b>᧫</b> - боец</div><div><b>᧬</b> - стрелок</div><div><b>᧭</b> - викинг</div><div><b>᧮</b> - кот</div><div><b>᧯</b> - берсерк</div><div><b>᧠</b> - вышибала</div><div><b>᧧</b> - звезда</div><div><b>᧨</b> - пацан</div><div><b>᧩</b> - джедай</div><div><b>᧪</b> - ситх</div><div><b>쯅</b> - военком</div><div><b>쯮</b> - аббат</div><div><b>쯱</b> - рабочий</div><div><b>쯃</b> - механик</div></div><p><b>1m</b> - это таймер, в течении которого у игрока будет стоять этот префикс.</p><p>Для того, чтобы снять добавленный префикс игроку, достаточно прописать команду :</p><div class="cmd">/lp user ник игрока meta removetempprefix 6</div><p>- убрать префикс</p>`};
const cards=G.map((g,i)=>({t:g[0],d:g[1],b:g[2],tags:TG[g[0]]||[],h:HTML[i]||"",i}));
function render(){const words=norm($("#q").value).split(/\s+/).filter(Boolean).map(w=>w.slice(0,Math.max(4,w.length-3)));
const list=cards.filter(c=>{const h=norm(c.t+" "+c.d+" "+c.b+" "+c.h.replace(/<[^>]+>/g," "));return words.every(w=>h.includes(w))&&(!tag||c.tags.includes(tag))});
$("#note").textContent=tag&&!cards.some(c=>c.tags.includes(tag))?"Теги на панелях пока не расставлены — фильтр заработает после их добавления.":"";
const g=$("#grid");g.innerHTML="";
list.forEach((c,n)=>{const b=document.createElement("button");b.className="card";b.style.animationDelay=n*25+"ms";
b.innerHTML=`<div class="ic a${c.i%5}"><svg viewBox="0 0 24 24"><path d="${IC[c.i]}"/></svg></div><h3>${c.t}</h3>${c.d?`<p>${c.d}</p>`:""}`;
b.onclick=()=>{beep(720);const sn=c.t==="Coming soon";document.querySelector(".box").classList.toggle("empty",sn);$("#mt").textContent=sn?"":c.t;$("#mb").innerHTML=sn?"":c.h||`<p>${c.d}</p><p>${c.b}</p><p style="color:var(--mut)">Полный текст гайда будет добавлен позже.</p>`;$("#modal").classList.add("open")};g.append(b)});
if(!list.length)g.innerHTML='<div id="empty">Ничего не найдено. Попробуйте другой запрос.</div>'}
$("#q").oninput=render;render();
const close=()=>{$("#modal").classList.remove("open");beep(400)};$("#cl").onclick=close;$("#modal").onclick=e=>{if(e.target.id==="modal")close()};
</script></body></html>
